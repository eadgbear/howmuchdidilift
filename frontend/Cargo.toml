[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#leptos = {git = "https://github.com/leptos-rs/leptos", features=["csr"]}
#leptos_meta = {git = "https://github.com/leptos-rs/leptos", features=["csr"]}
#leptos_router = {git = "https://github.com/leptos-rs/leptos", features=["csr"]}
leptos = { version = "0.5.4", features = ["csr"] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
copy_dir = "0.1.3"

leptos_meta = { version = "0.5.1" }
leptos_router = { version = "0.5.1", features = ["csr"] }
log = "0.4.20"
interface = { version = "0.1.0", path = "../interface" }
thiserror = "1.0.52"
gloo-net = "0.5.0"
anyhow = "1.0.76"
#leptos-struct-table = "0.6.0"
serde = { version = "1.0.193", features = ["derive"] }
gloo-storage = "0.3.0"
base64 = "0.22"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
eyre = "0.6.11"
#thaw = { version = "0.1.5", features = ["leptos_meta"] }

